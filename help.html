ng:-.6px;text-decoration:none;color:var(--ink)}.brand-mark{display:grid;place-items:center;width:35px;height:35px;border-radius:12px;background:var(--wash);color:var(--blue)}.help-label{font-size:13px;letter-spacing:0;font-weight:500;color:var(--muted);margin-left:8px}#help-theme{width:39px;height:39px;border:1px solid var(--line);border-radius:50%;font-size:23px;background:var(--panel)}main{max-width:1280px;padding:22px 32px 70px;margin:auto}.intro{max-width:740px;margin:18px auto 36px;text-align:center}.eyebrow{font-size:10px;font-weight:650;letter-spacing:2px;color:var(--muted)}h1{font-size:clamp(34px,5vw,52px);font-weight:650;letter-spacing:-2px;margin:13px 0}p{line-height:1.6}.intro>p:not(.eyebrow){color:var(--muted);font-size:16px}.help-search{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 19px;margin-top:28px;border-radius:999px;border:1px solid var(--line);background:var(--panel);box-shadow:0 8px 24px var(--shadow)}.help-search svg{width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:1.8;flex-shrink:0}.help-search input{width:100%;min-width:0;border:0;background:none;color:var(--ink);outline:none;font-size:15px;line-height:26px}.help-search input::-webkit-search-cancel-button{display:none}.help-search button{border-radius:50%;font-size:22px;width:28px;height:28px}.help-search:focus-within{border-color:#7aa7d1}.help-search kbd{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:2px 7px;border-radius:6px}.topics{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.topics button{padding:10px 17px;border-radius:999px;border:1px solid var(--line);font-size:13px}.topics button[aria-pressed=true]{color:var(--blue);background:var(--wash);border-color:transparent}.results-heading{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:27px 3px 13px;color:var(--muted);font-size:12px}.results-heading p{margin:0}.results-heading button{padding:7px 12px;border-radius:999px;font-size:12px}.guides{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}.guide{padding:25px;border-radius:26px;border:1px solid var(--line);background:var(--panel);box-shadow:0 9px 30px var(--shadow);scroll-margin-top:20px}.guide-top{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:10px;color:var(--muted);letter-spacing:.4px}.guide-top a{font-size:17px;text-decoration:none;color:var(--muted);padding:2px 5px}.guide h2{font-size:21px;letter-spacing:-.5px;margin:13px 0 10px;line-height:1.25}.guide>p{font-size:14px;color:var(--muted);margin:0 0 17px}.guide details{font-size:13px;line-height:1.7;margin-top:15px}.guide summary{cursor:pointer;font-size:13px;color:var(--blue);padding:5px 0}.guide ol{padding-left:21px;margin:13px 0}.guide li{padding:0 0 9px 3px}.guide .note{font-size:12px;color:var(--muted);padding:11px 13px;border-radius:13px;background:var(--shadow);line-height:1.65}.visual{margin:0;padding:17px;border-radius:18px;background:var(--shadow);border:1px solid var(--line);min-height:120px;display:flex;flex-direction:column;justify-content:center;gap:12px;font-size:13px}.visual figcaption{font-size:11px;line-height:1.5;color:var(--muted);text-align:center}.demo-row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px}.demo-pill{border-radius:999px;padding:8px 13px;background:var(--panel);border:1px solid var(--line);color:var(--ink);white-space:nowrap;font-size:12px}.demo-pill[aria-pressed=true],.demo-pill.on{background:var(--wash);color:var(--blue);border-color:transparent}.demo-input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.5;color:var(--ink);background:var(--panel);resize:vertical}.demo-output{display:block;white-space:pre-wrap;overflow-wrap:anywhere;text-align:center;line-height:1.6;color:var(--blue);font-size:14px;min-height:22px}.mini-card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px;min-width:74px;line-height:1.65;text-align:center}.mini-card small{display:block;font-size:10px;color:var(--muted)}.mini-card.selected{background:var(--wash);border-color:#80a4cf70}.demo-arrow{font-size:19px;color:var(--muted)}.text-mark{background:var(--wash);color:var(--blue);border-radius:4px;padding:1px 3px}.mini-menu{padding:11px 15px;border-radius:15px;background:var(--panel);border:1px solid var(--line);line-height:2;width:min(100%,230px);margin:auto}.mini-menu .muted{color:var(--muted)}.mini-file{padding:14px;border-radius:14px;background:var(--wash);font-size:12px;color:var(--blue)}.demo-scale{width:100%;accent-color:#6a9fd5}.demo-hint{font-size:11px;color:var(--muted);text-align:center}.shortcut{font:inherit;font-size:12px;border:1px solid var(--line);padding:4px 8px;border-radius:7px;background:var(--panel)}.empty{text-align:center;padding:65px 20px;color:var(--muted)}.empty h2{color:var(--ink)}.empty button{padding:12px 18px;background:var(--wash);border-radius:999px;color:var(--blue)}footer{text-align:center;padding:22px 24px 38px;font-size:11px;color:var(--muted)}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}#help-guides .guide:target{outline:2px solid #8db5dd;outline-offset:3px}@media(max-width:760px){.help-header{padding:20px}.guides{grid-template-columns:1fr}main{padding:10px 18px 45px}.intro{margin-top:12px}.guide{padding:20px}.topics{gap:6px}.topics button{padding:9px 12px;font-size:12px}.help-search{padding:11px 14px}.help-search kbd{display:none}}@media(prefers-reduced-motion:no-preference){.topics button,.demo-pill{transition:background .15s}.guide:target{animation:guide-arrive .35s ease-out}@keyframes guide-arrive{from{transform:translateY(5px);opacity:.7}to{transform:none;opacity:1}}}

<header class="help-header"><a class="brand" id="back-to-app" href="index.html" aria-label="Return to SCopier"><span class="brand-mark" aria-hidden="true">S</span> SCopier <span class="help-label">Help</span></a><button id="help-theme" type="button" aria-label="Switch colour theme">◐</button></header>
<main><section class="intro"><p class="eyebrow">YOUR WORKSPACE, EXPLAINED</p><h1>A guide to SCopier.</h1><p>Find a tool, try an example, or work through the basics.</p><label class="help-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="help-search" type="search" placeholder="Search tools, actions, or a problem…" autocomplete="off" aria-label="Search the guide"><button id="clear-search" type="button" aria-label="Clear help search" hidden>×</button><kbd aria-hidden="true">/</kbd></label></section>
<nav id="help-topics" class="topics" aria-label="Guide topics"></nav><div class="results-heading"><p id="help-results" role="status" aria-live="polite"></p><button id="expand-guides" type="button" aria-expanded="false">Show all steps</button></div><section id="help-guides" class="guides" aria-label="Help articles"></section><section id="help-empty" class="empty" hidden><h2>No matching guides.</h2><p>Try “join”, “select”, “copy”, “location”, or “backup”.</p><button id="reset-help" type="button">Show every guide</button></section><p id="demo-status" class="sr-only" role="status" aria-live="polite"></p><noscript><p>Enable JavaScript to search and use the visual examples. Your cards are in SCopier; the guide does not modify them.</p></noscript></main><footer>Examples use sample text. Your cards stay in your workspace.</footer><script>(() => {
 'use strict';
 const guides=[
  {id:'cards',topic:'Basics',title:'Create, name and edit cards',intro:'A card holds a title and the text you want to keep ready to copy.',demo:'card',keywords:'new add plus write paste rename empty starter limit',steps:['Type or paste into a card. Click its title to rename it; an unnamed card is shown as Untitled.','Use + in the top bar or quick-copy tray to add a card. SCopier allows up to two empty cards at a time. Fill or remove an empty card before adding another.','Changes are saved automatically when browser storage is available. Copy a card to send its text to your clipboard.'],note:'While both starter cards are empty, one is protected from deletion. Write in either starter card first. A workspace can contain up to 1,000 cards, including Trash.'},
  {id:'navigation',topic:'Basics',title:'Cards, History and Trash',intro:'The top pill changes which part of your workspace you are viewing.',demo:'nav',keywords:'tabs bar navigate switch deleted edits',steps:['Cards is your current workspace. This is where you edit, join, select and rearrange.','History contains copied text, previous edits and deletion records. Trash holds cards you moved out of the workspace.','Click a section name or drag the pill. Advanced copy appears only in Cards.']},
  {id:'quick-copy',topic:'Basics',title:'Copy from a card or the quick-copy tray',intro:'Copy buttons in the bottom tray give you a shortcut to your cards.',demo:'copy',keywords:'clipboard bottom dock copy 1 2 tray expand collapse',steps:['Click Copy on a card, or its Copy 1, Copy 2… button in the bottom tray. The numbers follow card order.','When the tray is crowded, use its expand control or scroll through the quick-copy buttons.','In Join mode, use the joined Copy button to copy the chosen cards together. In card-selection mode, quick buttons select cards instead of copying.'],note:'The example below changes only its sample output; it does not overwrite your clipboard.'},
  {id:'search',topic:'Basics',title:'Find text in your workspace',intro:'Search card titles and text in the section you are viewing.',demo:'search',keywords:'find filter magnifying glass slash no matches query',steps:['Click the search icon in the top bar, or press / while you are not typing.','Type a word from a title or the card text. Switch to History or Trash to search that section.','Clear the query or close search to show all items again. Escape closes search.']},
  {id:'advanced',topic:'Copy & format',title:'Turn on Advanced copy',intro:'Combine copying tools without rewriting your original cards.',demo:'advanced',keywords:'enable toggle switch options numbers join select text menu',steps:['Open the ••• menu at the top right and turn on Advanced copy.','Choose Numbers, Select text, Join, a separator, copy order, or letter case. You can combine these tools.','Open Preview to inspect the result. Use Reset to restore the default copy settings.'],note:'The tools transform the copied result. They do not change the text stored in your cards. They are hidden in History and Trash.'},
  {id:'numbers',topic:'Copy & format',title:'Extract only the numbers',intro:'Numbers keeps numeric values and removes the surrounding words.',demo:'numbers',keywords:'digits signed decimal exponent scientific numeric values missing numbers',steps:['Turn Numbers on in Advanced copy.','Copy a card, join cards, or select text. Signed numbers, decimals, grouped values and scientific notation can be recognised.','For a collection, choose the separator you want between the results. Turn Numbers off to copy the original words again.'],note:'If there are no numeric values in the current source, SCopier explains why there is nothing to copy.'},
  {id:'select-text',topic:'Copy & format',title:'Copy chosen words across cards',intro:'Select text collects exact snippets rather than whole cards.',demo:'text',keywords:'highlight characters words snippet selection chips read only edit',steps:['Turn Select text on, then drag over words or characters in a card. You can also select with the keyboard.','Select more text in the same card or another card. The snippets appear in Preview.','Click a snippet chip to remove it, or use Clear selections. Use the separator and order controls to arrange the output.','Turn Select text off when you want to edit your card text again.'],note:'A selected snippet is removed from the output if an edit makes that snippet no longer match the card.'},
  {id:'join',topic:'Copy & format',title:'Join cards into one copy',intro:'Choose the cards you want, then copy them as one result.',demo:'join',keywords:'combine merge joined collection multiple cards selection',steps:['Turn Join on. Click cards with text, or their selection circles, to include or remove them.','Set a separator and choose Card order or Selection order. Preview shows the resulting text.','Use the joined Copy button. Turn Join off to return to separate card copies.'],note:'Empty cards cannot be joined. Card editing is paused while Join is active; turn it off to edit.'},
  {id:'separators',topic:'Copy & format',title:'Choose what goes between copied parts',intro:'New line, Space, Comma and None control how a collection is joined.',demo:'separator',keywords:'newline blank comma punctuation join spacing glue',steps:['Use New line for one part per line, Space for a sentence, Comma for a list, or None for direct concatenation.','Separators apply to joined cards and collections of selected text or cards.','Check Preview before copying to see exactly where spaces and line breaks will appear.']},
  {id:'copy-order',topic:'Copy & format',title:'Card order or Selection order',intro:'The order control decides which chosen part comes first.',demo:'order',keywords:'sequence sort selection chronology joined cards',steps:['Card order follows the arrangement of your cards.','Selection order follows the order in which you chose cards or snippets.','Rearranging a card changes Card order. Preview lets you compare the two before copying.']},
  {id:'letter-case',topic:'Copy & format',title:'Change the copied letter case',intro:'Use Original, UPPERCASE, lowercase or Title Case for the output.',demo:'case',keywords:'capital letters upper lower title original menu formatting',steps:['Open the letter-case menu in Advanced copy.','Choose the style you want. The active choice is marked in the menu.','Copy a card or collection. Choose Original to keep its original capitals.'],note:'These examples use simple English words. Your original card remains unchanged.'},
  {id:'preview',topic:'Copy & format',title:'Know what you are about to copy',intro:'Preview follows the current card or the collection you are working with.',demo:'preview',keywords:'result mismatch source ready paste copy preview all selections',steps:['Turn Preview on in Advanced copy.','Click or copy a card to make it the current source. With Join or Select text active, Preview follows that collection.','Use Joined cards or All selections, when shown, to return to the collection preview.','Copy preview copies that displayed result. An empty result explains the next step instead of copying nothing.']},
  {id:'card-selection',topic:'Organise',title:'Select cards, select all and deselect',intro:'Card selection is a separate mode for choosing and arranging cards.',demo:'select',keywords:'tick circle bulk all cross exit deselect menus missing copy buttons',steps:['Click Select in Advanced copy to enter card-selection mode.','Click cards or quick-copy buttons to select individual cards. The same Select button now offers Select all.','Click Select all to select every card. When all are selected, the same button becomes Deselect all.','Deselect all clears the choices but keeps selection mode active. Use the × button beside it to leave selection mode.'],note:'Card menus and individual Copy buttons are hidden during selection mode. Leaving the mode restores them.'},
  {id:'rearrange',topic:'Organise',title:'Move cards and quick-copy buttons',intro:'Arrange your workspace while card-selection mode is active.',demo:'rearrange',keywords:'drag drop reorder app tray autoscroll quick bar hide position move',steps:['Turn on Select, then drag a card to a new position. Move toward the viewport edges to scroll while dragging.','You can also drag quick-copy buttons to change card order. The quick-copy tray stays visible while its buttons are being moved.','The tray gets out of the way when moving cards. Drop the item where you want it, then leave selection mode with ×.'],note:'You can also use Move earlier or Move later in a card’s menu outside selection mode.'},
  {id:'card-menu',topic:'Organise',title:'Use the menu on a card',intro:'The card’s ••• menu contains card actions and recognised text.',demo:'menu',keywords:'duplicate move earlier later delete menu options',steps:['Open ••• on a card to duplicate it, move it earlier or later, or move it to Trash.','Duplicate creates an independent card with the same text. Move earlier and Move later change card order.','Recognised links, phone numbers, locations, dates and durations appear below the card actions.','If the card menu is missing, leave card-selection mode with the × button.']},
  {id:'links-phones',topic:'Smart actions',title:'Copy a link or call a phone number',intro:'Keep copying separate from opening the destination.',demo:'entities',keywords:'url website www https phone mobile telephone call open icon compact multiple',steps:['Put a web link or phone number in a card, then open the card’s menu.','Use Copy link or Copy number to copy its value. Use the opening or phone action to visit the website or hand the number to your calling app.','If several items are detected, expand that group inside the same menu. Each compact row has its own copy and action controls.'],note:'Opening a link or starting a call hands control to your browser or device. A calling app may need to be configured.'},
  {id:'locations',topic:'Smart actions',title:'Copy a place or open it in Maps',intro:'SCopier recognises many countries, cities, landmarks, addresses and coordinates.',demo:'maps',keywords:'country location maps apple google address recognition city places earth offline',steps:['Use a place name, coordinates, or a labelled address such as “Address: 12 Park Street, Kolkata”.','Open the card menu. Copy location copies the recognised text; the map action opens a search for that place.','Multiple places expand as compact rows inside the same menu. Add a city, country, or “Location:” label if a name is ambiguous.'],note:'Recognition works offline using the included place list and text rules. It is not address verification. Maps searches need an internet connection and may return several matches.'},
  {id:'dates-timers',topic:'Smart actions',title:'Recognise dates and start a timer',intro:'Dates can become calendar files; durations can become countdowns.',demo:'timer',keywords:'calendar ics date today tomorrow countdown pause resume timer minutes hours seconds',steps:['Try a clear date such as 17 October 2026, “tomorrow”, or “next Monday”. Choose its calendar action to download an .ics file for your calendar app.','For a countdown, use text such as “5 minutes”, “1 hour 20 minutes”, or “timer: 05:00”, then choose Start timer in the card menu.','Use the timer’s Pause or Resume control, or its close control to remove it. Only one current timer is retained.'],note:'Ambiguous numeric dates are deliberately skipped. Countdown timing is based on the saved end time, but this is not a background alarm service.'},
  {id:'history',topic:'Organise',title:'Find and reuse earlier text',intro:'History keeps copied text and snapshots of previous edits.',demo:'history',keywords:'old restore rewind use again previous edits copied clear history undo',steps:['Switch to History. Search titles or text to find an entry.','Copy copies that historical text. Use again creates a new current card, leaving the historical entry in place.','Delete removes a history entry. Clear history asks for confirmation and keeps your cards.','When offered, Undo restores the removed history. History keeps up to 300 entries.']},
  {id:'trash',topic:'Organise',title:'Restore or permanently remove a card',intro:'Trash is the holding place for cards you moved out of Cards.',demo:'trash',keywords:'deleted restore permanent remove clear trash undo recovery',steps:['Switch to Trash and choose Restore on a card to return it to Cards.','Use Delete permanently in its menu to remove it and its history after confirmation.','Clear trash also asks for confirmation. Use the immediate Undo message if you cleared Trash by mistake.'],note:'Deleting an empty card removes it directly. Permanently deleting an individual card cannot be undone with a later browser reload. Export a backup if you need a separate copy.'},
  {id:'scale',topic:'Settings',title:'Fit the interface to your screen',intro:'Scale changes the entire interface, including cards, menus and controls.',demo:'scale',keywords:'small smallest standard large largest density more columns layout five dot blob',steps:['Open ••• at the top right, then expand Scale.','Click one of the five points, drag the blob, or use the accessible range control with the keyboard.','Smaller settings fit more cards where there is room. Setting 3 is Standard. The chosen scale is restored with your workspace.'],note:'The dot briefly becomes its number while you interact, then returns to a dot.'},
  {id:'appearance',topic:'Settings',title:'Light, dark and less animated glass',intro:'Choose the appearance that feels comfortable for your device.',demo:'appearance',keywords:'theme dark light reduce motion transparency glass shimmer performance accessibility',steps:['Open the top-right menu to switch light or dark mode.','Reduce motion limits animated movement. Reduce transparency uses more opaque surfaces and reduces optical effects.','These options can help when motion is uncomfortable or a device struggles with the glass effects. System preferences are used when you have not made an explicit choice.'],note:'A quieter or opaque appearance is intentional when these preferences are enabled.'},
  {id:'backup',topic:'Settings',title:'Export and import a backup',intro:'Backups contain your cards, history and workspace settings.',demo:'backup',keywords:'download json file import export transfer device restore cancel invalid size 10 mb',steps:['Open the top-right menu and choose Export backup at the bottom. Confirm to download a .json file.','On another browser or device, open Import backup and choose that file. Review the confirmation before adding its cards and history.','Import adds cards to the current workspace; it does not replace the current cards or apply all settings from the imported workspace.','Keep the exported file unedited. Imports are limited to 10 MB and 1,000 total cards, including Trash.'],note:'Cancelling an import leaves the workspace unchanged. Treat a backup as private: it contains the text in your cards.'},
  {id:'blocked-actions',topic:'Troubleshooting',title:'Understand an unavailable action',intro:'A message explains what stopped the action and what you can do next.',demo:'blocked',keywords:'error cannot cant disabled permission empty no numbers not allowed blocked why',steps:['If + cannot add a card, fill or remove an empty card first. There can be at most two empty cards.','If Join has nothing to copy, choose a card that contains text. If Numbers finds nothing, select numeric text or turn Numbers off.','If Delete has no target, enter Select and choose cards. A protected empty starter card needs text in either starter card first.','If a menu or editing control is missing, check whether Join, Select text or card-selection mode is active.'],note:'Unavailable controls can explain the restriction when clicked or activated by keyboard. The message stays visible longer so you can read the next step.'},
  {id:'copy-problems',topic:'Troubleshooting',title:'When the browser will not copy',intro:'Browser permissions can prevent clipboard access, even when your text is ready.',demo:'clipboard',keywords:'cant cannot unable copy failed blocked permission clipboard https localhost safari shortcut ctrl command',steps:['Try copying directly from a button. Browsers can require a user click and a secure page for clipboard access.','SCopier tries a fallback if direct clipboard access fails. If both attempts are blocked, select the text and use your device’s copy shortcut.','Check the site’s clipboard permission if available. For hosted use, open the HTTPS address.'],note:'The guide’s examples never read from or write to your real clipboard.'},
  {id:'saving',topic:'Troubleshooting',title:'Keep your workspace safe',intro:'Your workspace is kept in this browser when local storage is available.',demo:'storage',keywords:'autosave data lost quota private browsing incognito storage full persistence security offline backup',steps:['Export a backup before changing browsers, clearing site data, or relying on a private-browsing session.','If storage is full or blocked, export a backup before closing the page. Remove unused cards and old history to free space.','If stored data could not be loaded, export what you can before editing. There is no account-based cloud recovery.'],note:'The app does not send your card text to a server. Opening external websites, Maps, calling apps or calendar files uses the service you choose.'},
  {id:'shortcuts',topic:'Basics',title:'Keyboard shortcuts and accessibility',intro:'Use the workspace without relying on drag gestures.',demo:'shortcuts',keywords:'keyboard shortcut tab escape slash alt copy command control arrows screen reader',steps:['Press / outside a text field to open search. Escape closes search or open menus.','Alt + 1 through Alt + 9 copies the corresponding current card, if it exists.','Use Tab to reach controls, then Enter or Space to activate them. The scale range also works with arrow keys.','Use card-menu Move earlier and Move later as an alternative to dragging. Messages are announced to assistive technology.']}
 ];
 const $=selector=>document.querySelector(selector),escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),params=new URLSearchParams(location.search),topics=['All','Basics','Copy & format','Organise','Smart actions','Settings','Troubleshooting'];let topic=topics.includes(params.get('topic'))?params.get('topic'):'All',manualSteps=null;
 const from=params.get('from')==='SCopier.html'?'SCopier.html':'index.html';$('#back-to-app').href=from;
 const theme=params.get('theme');document.documentElement.dataset.theme=['light','dark'].includes(theme)?theme:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
 $('#help-theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';};
 const pill=(label,action,active=false)=>`<button type="button" class="demo-pill" data-demo="${action}" aria-pressed="${active}">${label}</button>`,row=content=>`<div class="demo-row">${content}</div>`,mini=(label,text)=>`<div class="mini-card"><small>${label}</small>${text}</div>`,output=text=>`<output class="demo-output">${text}</output>`;
 function visual(kind){
  const staticScenes={card:[mini('01 · TRAVEL','Train at 10:30')+'<span class="demo-arrow">→</span>'+mini('02 · UNTITLED','Your next idea'),'A title above, your text below.'],advanced:['<div class="mini-menu">••• Workspace options<br><strong>Advanced copy　●</strong><br><span class="muted">Scale　·　Appearance　·　Help</span></div>','The tools appear below the top bar.'],text:['<div class="mini-card">Meet <span class="text-mark">on Friday</span> at <span class="text-mark">the station</span>.</div>'+output('on Friday · the station'),'Choose only the words you need.'],preview:['<div class="mini-menu">Numbers　<span class="text-mark">on</span><br>Card: Apples 12, pears 8</div>'+output('12, 8'),'Preview shows the current transformed output.'],rearrange:[mini('01','Alpha')+'<span class="demo-arrow">↔</span>'+mini('02','Beta')+'<span class="demo-arrow">↔</span>'+mini('03','Gamma'),'Select → drag → drop. Card order and quick-copy order stay together.'],menu:['<div class="mini-menu">Duplicate<br>Move earlier<br>Move later<br>Move to trash</div>','Open ••• on the card you want to change.'],entities:['<div class="mini-menu">Copy link 1　↗<br>Copy number 1　☎</div>','Copy the value, or use its separate opening action.'],maps:['<div class="mini-menu">Location: Kolkata, India<br><span class="text-mark">Copy location</span>　↗</div>','A recognised place becomes a Maps search when you choose the map action.'],timer:['<div class="mini-menu">5 minutes　→　Start timer<br><strong>04:59</strong>　Pause　×</div>','The timer can be paused, resumed or removed.'],history:['<div class="mini-menu">Previous edit · Project notes<br>Copy　·　Use again　·　Delete</div>','Use again adds a new card from the historical text.'],trash:[mini('CARDS','Notes')+'<span class="demo-arrow">→</span>'+mini('TRASH','Restore ↶'),'Restore returns a card; permanent removal asks for confirmation.'],appearance:['<div class="mini-menu">Light / dark<br>Reduce motion<br>Reduce transparency</div>','Choose a calmer or more opaque appearance.'],backup:['<div class="mini-file">SCopier → backup.json</div><span class="demo-arrow">⇄</span><div class="mini-file">Import → review → add</div>','Export and import both ask for confirmation.'],blocked:['<div class="mini-card">+ Add card</div>'+output('Two empty cards already exist.<br>Fill one, then try again.'),'The message explains a next step.'],clipboard:['<span class="shortcut">⌘ C</span><span class="demo-arrow">or</span><span class="shortcut">Ctrl C</span>','A manual copy shortcut is a fallback when browser copying is blocked.'],storage:['<div class="mini-file">Your browser</div><span class="demo-arrow">→</span><div class="mini-file">Your backup file</div>','Keep a backup outside the browser.'],shortcuts:['<span class="shortcut">/</span> Search <span class="shortcut">Esc</span> Close <span class="shortcut">Alt 1–9</span> Copy','You can also navigate controls with Tab.']};
  if(staticScenes[kind])return `<figure class="visual">${row(staticScenes[kind][0])}<figcaption>${staticScenes[kind][1]}</figcaption></figure>`;
  if(kind==='nav')return `<figure class="visual">${row(['Cards','History','Trash'].map((name,i)=>pill(name,'nav',i===0)).join(''))}${output('Edit and arrange your current cards.')}<figcaption>Try changing sections.</figcaption></figure>`;
  if(kind==='copy')return `<figure class="visual"><input class="demo-input" data-demo-input="copy" aria-label="Sample text for copying" value="A thought worth keeping.">${row(pill('Try copy','copy'))}${output('Your sample output appears here.')}<figcaption>This demo shows the result without changing your clipboard.</figcaption></figure>`;
  if(kind==='search')return `<figure class="visual"><input class="demo-input" data-demo-input="search" aria-label="Try searching sample cards" placeholder="Try “train”">${output('Travel · Train at 10:30\nShopping · Apples and pears')}<figcaption>Try filtering these two sample cards.</figcaption></figure>`;
  if(kind==='numbers')return `<figure class="visual"><input class="demo-input" data-demo-input="numbers" aria-label="Try extracting sample numbers" value="Apples 12, pears 8, discount -2.5">${output('12\n8\n-2.5')}<figcaption>Edit the example to try number extraction.</figcaption></figure>`;
  if(kind==='join')return `<figure class="visual">${row(pill('Alpha','join',true)+pill('Beta','join',true)+pill('Gamma','join'))}${output('Alpha Beta')}<figcaption>Choose sample cards to build a joined result.</figcaption></figure>`;
  if(kind==='separator')return `<figure class="visual">${row(['New line','Space','Comma','None'].map((label,i)=>pill(label,'separator',i===1)).join(''))}${output('Alpha Beta')}<figcaption>The same two parts, separated four ways.</figcaption></figure>`;
  if(kind==='order')return `<figure class="visual">${row(pill('Card order','order',true)+pill('Selection order','order'))}${output('Alpha → Beta')}<figcaption>Sample card order is Alpha, Beta. Beta was selected first.</figcaption></figure>`;
  if(kind==='case')return `<figure class="visual"><input class="demo-input" data-demo-input="case" aria-label="Sample text for letter case" value="a little idea">${row(['Original','UPPERCASE','lowercase','Title Case'].map((label,i)=>pill(label,'case',i===0)).join(''))}${output('a little idea')}<figcaption>Change the output while keeping the input unchanged.</figcaption></figure>`;
  if(kind==='select')return `<figure class="visual">${row(['Alpha','Beta','Gamma'].map(label=>pill(label,'select')).join(''))}${row(pill('Select all','select-all')+pill('Deselect all','select-none'))}${output('0 sample cards selected')}<figcaption>Try individual selection, Select all, and Deselect all.</figcaption></figure>`;
  return `<figure class="visual"><input class="demo-scale" data-demo-input="scale" type="range" min="1" max="5" value="3" aria-label="Try the five scale options">${output('3 · Standard')}<figcaption>Try all five points. This changes only the sample label.</figcaption></figure>`;
 }
 $('#help-topics').innerHTML=topics.map(name=>`<button type="button" data-topic="${escape(name)}" aria-pressed="${name===topic}">${escape(name)}</button>`).join('');
 $('#help-guides').innerHTML=guides.map((guide,i)=>`<article class="guide" id="${guide.id}"><div class="guide-top"><span>${String(i+1).padStart(2,'0')} / ${escape(guide.topic)}</span><a href="#${guide.id}" aria-label="Link to ${escape(guide.title)}">#</a></div><h2>${escape(guide.title)}</h2><p>${escape(guide.intro)}</p>${visual(guide.demo)}<details><summary>Steps &amp; details</summary><ol>${guide.steps.map(step=>'<li>'+escape(step)+'</li>').join('')}</ol>${guide.note?'<p class="note">'+escape(guide.note)+'</p>':''}</details></article>`).join('');
 const normalize=value=>String(value).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[’']/g,'').replace(/[^\p{L}\p{N}]+/gu,' ').trim(),articles=guides.map(guide=>({guide,node:document.getElementById(guide.id),text:normalize([guide.title,guide.intro,guide.keywords,...guide.steps,guide.note||''].join(' '))}));$('#help-search').value=params.get('q')||'';
 function filter(){const query=$('#help-search').value.trim(),terms=normalize(query).split(/\s+/).filter(term=>term&&!['how','do','does','i','the','a','an','to','my','can','why','is','it','what','when','where'].includes(term));let count=0;for(const {guide,node,text}of articles){const show=(topic==='All'||guide.topic===topic)&&terms.every(term=>text.includes(term));node.hidden=!show;if(show){count++;node.querySelector('details').open=manualSteps??!!query;}}$('#help-results').textContent=count+' '+(count===1?'guide':'guides')+(query?' matching your search':'');$('#help-empty').hidden=count>0;$('#help-guides').hidden=count===0;$('#clear-search').hidden=!query;$('#expand-guides').hidden=count===0;const allOpen=count>0&&articles.filter(item=>!item.node.hidden).every(item=>item.node.querySelector('details').open);$('#expand-guides').textContent=allOpen?'Hide all steps':'Show all steps';$('#expand-guides').setAttribute('aria-expanded',String(allOpen));for(const button of $('#help-topics').querySelectorAll('button'))button.setAttribute('aria-pressed',String(button.dataset.topic===topic));const url=new URL(location.href);if(query)url.searchParams.set('q',query);else url.searchParams.delete('q');if(topic!=='All')url.searchParams.set('topic',topic);else url.searchParams.delete('topic');try{history.replaceState(null,'',url.href);}catch{}}
 $('#help-search').addEventListener('input',()=>{manualSteps=null;filter();});$('#help-topics').addEventListener('click',e=>{const button=e.target.closest('[data-topic]');if(!button)return;topic=button.dataset.topic;filter();});
 $('#clear-search').onclick=()=>{$('#help-search').value='';filter();$('#help-search').focus();};$('#reset-help').onclick=()=>{topic='All';$('#help-search').value='';filter();$('#help-search').focus();};$('#expand-guides').onclick=()=>{manualSteps=!articles.filter(item=>!item.node.hidden).every(item=>item.node.querySelector('details').open);filter();};
 function updateDemo(figure,kind,button){const out=figure.querySelector('output'),input=figure.querySelector('input'),buttons=[...figure.querySelectorAll('[data-demo]')];if(kind==='nav'){buttons.forEach(b=>b.setAttribute('aria-pressed',String(b===button)));out.textContent={Cards:'Edit and arrange your current cards.',History:'Copy or reuse previous text.',Trash:'Restore deleted cards or remove them permanently.'}[button.textContent];}else if(kind==='copy')out.textContent=input.value||'Write a little sample text first.';else if(kind==='numbers')out.textContent=(input.value.replace(/\u2212/g,'-').match(/[+-]?(?:(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?|\.\d+)(?:[eE][+-]?\d+)?/g)||[]).join('\n')||'No numbers found. Try adding 12 or -2.5.';else if(kind==='search'){const values=['Travel · Train at 10:30','Shopping · Apples and pears'].filter(text=>normalize(text).includes(normalize(input.value)));out.textContent=values.join('\n')||'No matching sample cards.';}else if(kind==='join'||kind==='select'){button.setAttribute('aria-pressed',String(button.getAttribute('aria-pressed')!=='true'));const selected=buttons.filter(b=>b.getAttribute('aria-pressed')==='true');out.textContent=kind==='join'?selected.map(b=>b.textContent).join(' ')||'Choose a sample card.':selected.length+' sample cards selected';}else if(kind==='select-all'||kind==='select-none'){const cards=buttons.filter(b=>b.dataset.demo==='select');cards.forEach(b=>b.setAttribute('aria-pressed',String(kind==='select-all')));out.textContent=(kind==='select-all'?cards.length:0)+' sample cards selected';}else if(kind==='separator'||kind==='order'||kind==='case'){if(button)buttons.forEach(b=>b.setAttribute('aria-pressed',String(b===button)));const label=(button||buttons.find(b=>b.getAttribute('aria-pressed')==='true')).textContent;if(kind==='separator')out.textContent='Alpha'+({'New line':'\n',Space:' ',Comma:', ',None:''}[label])+'Beta';else if(kind==='order')out.textContent=label==='Card order'?'Alpha → Beta':'Beta → Alpha';else{const text=input.value;out.textContent=label==='UPPERCASE'?text.toLocaleUpperCase():label==='lowercase'?text.toLocaleLowerCase():label==='Title Case'?text.toLocaleLowerCase().replace(/(^|\s)(\p{L})/gu,(_,space,c)=>space+c.toLocaleUpperCase()):text;}}else if(kind==='scale')out.textContent=input.value+' · '+['Smallest','Small','Standard','Large','Largest'][+input.value-1];$('#demo-status').textContent=out.textContent;}
 $('#help-guides').addEventListener('click',e=>{const button=e.target.closest('[data-demo]');if(button)updateDemo(button.closest('figure'),button.dataset.demo,button);});$('#help-guides').addEventListener('input',e=>{if(e.target.dataset.demoInput)updateDemo(e.target.closest('figure'),e.target.dataset.demoInput);});
 document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.target.matches('input,textarea,select')){e.preventDefault();$('#help-search').focus();}if(e.key==='Escape'&&e.target===$('#help-search')){$('#help-search').value='';filter();}});
 filter();if(location.hash){try{const target=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(target?.classList.contains('guide')){topic='All';$('#help-search').value='';target.querySelector('details').open=true;filter();target.querySelector('details').open=true;target.scrollIntoView?.();}}catch{}}
})();
</script></body></html>
